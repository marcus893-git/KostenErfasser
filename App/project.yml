# Projektbeschreibung für XcodeGen. Das Xcode-Projekt wird daraus erzeugt
# (auf dem Mac mit App/generate.sh, in der CI im Workflow „iOS-App“)
# und nicht eingecheckt. Team und Bundle-ID stehen in Signing.xcconfig
# bzw. in der lokalen, nicht eingecheckten Signing.local.xcconfig.
name: KostenErfasser
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  KostenErfasserCore:
    type: library.static
    platform: iOS
    sources:
      - path: ../Sources/KostenErfasserCore
    settings:
      base:
        PRODUCT_NAME: KostenErfasserCore
        SKIP_INSTALL: YES
  KostenErfasser:
    type: application
    platform: iOS
    sources:
      - path: KostenErfasser
    dependencies:
      - target: KostenErfasserCore
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: KostenErfasser
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: Die Kamera wird zum Scannen von Kassenzetteln und Rechnungen verwendet.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: NO
    scheme: {}
