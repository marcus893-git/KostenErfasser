name: iOS-App

on:
  push:
    paths:
      - "App/**"
      - "Sources/**"
      - "Package.swift"
      - ".github/workflows/ios-app.yml"
  workflow_dispatch:

jobs:
  build:
    name: App bauen (Kontrolle, unsigniert)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Xcode-Version
        run: xcodebuild -version
      - name: XcodeGen installieren
        run: brew install xcodegen
      - name: Xcode-Projekt erzeugen
        run: NO_OPEN=1 App/generate.sh
      - name: App bauen
        run: |
          set -o pipefail
          xcodebuild build \
            -project App/KostenErfasser.xcodeproj \
            -scheme KostenErfasser \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}
      - name: IPA packen
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/KostenErfasser.app Payload/
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' Payload/KostenErfasser.app/Info.plist)
          echo "Bundle-ID: $BUNDLE_ID, Version: $(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Payload/KostenErfasser.app/Info.plist) ($(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' Payload/KostenErfasser.app/Info.plist))"
          test "$BUNDLE_ID" = "de.kostenerfasser.app"
          zip -qry KostenErfasser.ipa Payload
          ls -lh KostenErfasser.ipa
      - name: Signatur-Sicherung von generate.sh prüfen
        run: |
          printf '\t\tDEVELOPMENT_TEAM = AB12CD34EF;\n' >> App/KostenErfasser.xcodeproj/project.pbxproj
          NO_OPEN=1 App/generate.sh
          grep -q '^DEVELOPMENT_TEAM = AB12CD34EF$' App/Signing.local.xcconfig
      - name: IPA hochladen
        uses: actions/upload-artifact@v5
        with:
          name: KostenErfasser-${{ github.run_number }}
          path: KostenErfasser.ipa
          retention-days: 30
